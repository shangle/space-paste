<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" fill="none">
  <!-- Outer Oval Badge Border -->
  <ellipse cx="150" cy="100" rx="140" ry="90" fill="#FFF8E1" stroke="#5D4037" stroke-width="7"/>
  <ellipse cx="150" cy="100" rx="130" ry="80" stroke="#00ACC1" stroke-width="4"/>

  <!-- Ringed Planet -->
  <circle cx="150" cy="62" r="22" fill="#F28C38" stroke="#5D4037" stroke-width="3"/>
  <!-- Planet Ring -->
  <ellipse cx="150" cy="62" rx="36" ry="10" fill="none" stroke="#00ACC1" stroke-width="5" transform="rotate(-15 150 62)"/>

  <!-- Rocket Ship -->
  <g transform="translate(210, 42) rotate(25) scale(0.85)">
    <!-- Fiery Trail -->
    <path d="M-15 12 L-35 8 L-22 18 L-40 22 L-20 26 Z" fill="#E53935"/>
    <path d="M-12 14 L-26 12 L-18 18 L-28 20 Z" fill="#FDD835"/>
    <!-- Rocket Body -->
    <path d="M0 0 C15 5 25 15 28 25 C15 22 5 15 0 0 Z" fill="#FFF8E1" stroke="#5D4037" stroke-width="3"/>
    <circle cx="14" cy="12" r="4" fill="#00ACC1" stroke="#5D4037" stroke-width="2"/>
    <path d="M-4 18 L-12 28 L0 22 Z" fill="#E53935" stroke="#5D4037" stroke-width="2"/>
  </g>

  <!-- Sparkle Stars -->
  <path d="M60 45 L62 52 L69 54 L62 56 L60 63 L58 56 L51 54 L58 52 Z" fill="#F28C38" stroke="#5D4037" stroke-width="1.5"/>
  <path d="M90 35 L91 40 L96 41 L91 42 L90 47 L89 42 L84 41 L89 40 Z" fill="#E53935" stroke="#5D4037" stroke-width="1.5"/>
  <path d="M225 110 L226 114 L230 115 L226 116 L225 120 L224 116 L220 115 L224 114 Z" fill="#FDD835" stroke="#5D4037" stroke-width="1.5"/>

  <!-- Stylized Retro Psychedelic Text "Space Paste" -->
  <text x="150" y="125" text-anchor="middle" font-family="'Shrikhand', cursive, sans-serif" font-size="44" font-weight="900" fill="#F28C38" stroke="#5D4037" stroke-width="3" letter-spacing="1">Space</text>
  <text x="150" y="162" text-anchor="middle" font-family="'Shrikhand', cursive, sans-serif" font-size="36" font-weight="900" fill="#5D4037" letter-spacing="2">Paste</text>
</svg>
