<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Space Paste - Physical Location Memory</title>
    <script type="text/javascript">
      // Single Page App Redirect for GitHub Pages
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/#/' + l.pathname.slice(1).replace(/^[#\/]/, '') + l.search + l.hash
      );
    </script>
  </head>
  <body>
    Redirecting to Space Paste Stash...
  </body>
</html>
